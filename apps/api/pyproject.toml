[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "souvenir-search-api"
version = "0.1.0"
description = "Browser-based supplier search, stage one"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "playwright>=1.50,<2",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "argon2-cffi>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: Chromium integration with deterministic fixtures", "live: opt-in live supplier tests", "postgres: opt-in real PostgreSQL integration"]
addopts = "-m 'not live and not postgres'"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
